[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micdot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "paho-mqtt>=1.6.1,<2.0",
    "pynput>=1.7.6",
    "pywebview>=4.0",
    "pyobjc-framework-ApplicationServices>=9.0; sys_platform == 'darwin'",
]

[project.scripts]
micdot = "micdot.main:main"

[tool.setuptools.packages.find]
include = ["micdot*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
build = [
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
