[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "espmuter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
    "paho-mqtt>=1.6.1,<2.0",
    "pynput>=1.7.6",
]

[project.scripts]
espmuter = "espmuter.main:main"

[tool.setuptools.packages.find]
include = ["espmuter*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
