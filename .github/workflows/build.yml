name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[build]"

      - name: Build app
        run: |
          MICDOT_VERSION="${GITHUB_REF_NAME#v}" pyinstaller MicDot.spec --noconfirm

      - name: Create zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIPNAME="MicDot-${VERSION}-${{ matrix.arch }}.app.zip"
          cd dist
          zip -r "../${ZIPNAME}" MicDot.app
          echo "ZIPNAME=${ZIPNAME}" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPNAME }}
          draft: false
          prerelease: false
