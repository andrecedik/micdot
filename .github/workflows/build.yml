name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (arm64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[build]"

      - name: Build app
        run: |
          MICDOT_VERSION="${GITHUB_REF_NAME#v}" pyinstaller MicDot.spec --noconfirm

      - name: Create zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIPNAME="MicDot-${VERSION}-arm64.app.zip"
          cd dist
          zip -r "../${ZIPNAME}" MicDot.app
          echo "ZIPNAME=${ZIPNAME}" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIPNAME }}
          draft: false
          prerelease: false
